# Builds the site with every library and AI model included, then publishes it to GitHub Pages.
name: Build and publish NoCap MoCap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download libraries
        run: |
          mkdir -p /tmp/deps && cd /tmp/deps
          npm init -y >/dev/null
          npm install --no-audit --no-fund three@0.160.0 @mediapipe/tasks-vision@0.10.14 mp4box@0.5.2 @ffmpeg/core@0.12.6

      - name: Assemble site
        run: |
          set -e
          D=/tmp/deps/node_modules
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg icon-180.png icon-512.png robots.txt .nojekyll _site/
          mkdir -p _site/vendor/three/build _site/vendor/three/examples/jsm
          cp $D/three/build/three.module.js _site/vendor/three/build/
          # whole folders, so helper files these modules import (e.g. utils/TextureUtils.js) come too
          cp -r $D/three/examples/jsm/controls $D/three/examples/jsm/exporters $D/three/examples/jsm/utils _site/vendor/three/examples/jsm/
          # character loaders (preview on your own FBX / GLB / VRM model)
          mkdir -p _site/vendor/three/examples/jsm/loaders _site/vendor/three/examples/jsm/libs _site/vendor/three/examples/jsm/curves
          cp $D/three/examples/jsm/loaders/FBXLoader.js $D/three/examples/jsm/loaders/GLTFLoader.js _site/vendor/three/examples/jsm/loaders/
          cp $D/three/examples/jsm/libs/fflate.module.js _site/vendor/three/examples/jsm/libs/
          cp $D/three/examples/jsm/curves/NURBSCurve.js $D/three/examples/jsm/curves/NURBSUtils.js _site/vendor/three/examples/jsm/curves/
          mkdir -p _site/vendor/tasks-vision
          cp $D/@mediapipe/tasks-vision/vision_bundle.mjs _site/vendor/tasks-vision/
          cp -r $D/@mediapipe/tasks-vision/wasm _site/vendor/tasks-vision/
          cp $D/mp4box/dist/mp4box.all.min.js _site/vendor/
          mkdir -p _site/vendor/ffmpeg
          cp $D/@ffmpeg/core/dist/umd/ffmpeg-core.js $D/@ffmpeg/core/dist/umd/ffmpeg-core.wasm _site/vendor/ffmpeg/

      - name: Download AI models (Google MediaPipe)
        run: |
          set -e
          mkdir -p _site/models
          B=https://storage.googleapis.com/mediapipe-models
          for q in heavy full lite; do
            curl -fSL --retry 3 -o _site/models/pose_landmarker_$q.task $B/pose_landmarker/pose_landmarker_$q/float16/latest/pose_landmarker_$q.task
          done
          curl -fSL --retry 3 -o _site/models/hand_landmarker.task $B/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
          ls -la _site/models

      - name: Check every import of the app's modules resolves
        run: |
          node -e '
          const fs=require("fs"),path=require("path");
          const map={"three":"_site/vendor/three/build/three.module.js"};
          const seen=new Set(); let bad=0;
          function check(f){ if(seen.has(f))return; seen.add(f);
            if(!fs.existsSync(f)){console.log("MISSING",f);bad++;return;}
            const src=fs.readFileSync(f,"utf8");
            for(const m of src.matchAll(/(?:^|\n)\s*(?:import|export)[^;]*?from\s*["\x27]([^"\x27]+)["\x27]/g)){
              const s=m[1]; if(map[s]){check(map[s]);continue;} if(s.startsWith(".")) check(path.join(path.dirname(f),s)); }
          }
          for(const f of ["controls/OrbitControls.js","exporters/GLTFExporter.js","utils/BufferGeometryUtils.js","loaders/FBXLoader.js","loaders/GLTFLoader.js"]) check("_site/vendor/three/examples/jsm/"+f);
          console.log("checked",seen.size,"files"); process.exit(bad?1:0);'

      - name: Download preview characters (Unity / Mixamo-compatible rigs; any source that is unavailable is skipped)
        run: |
          mkdir -p _site/characters && cd _site/characters
          T=https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf
          get() { curl -fsSL --retry 2 --max-time 90 -o "$1" "$2" || { rm -f "$1"; echo "skipped $1"; }; }
          # realistic Ready Player Me avatars: first source that still has them wins
          for u in https://readyplayerme.github.io/visage/male.glb https://raw.githubusercontent.com/readyplayerme/visage/main/public/male.glb https://raw.githubusercontent.com/readyplayerme/visage/develop/public/male.glb $T/readyplayer.me.glb; do [ -s rpm-male.glb ] || get rpm-male.glb $u; done
          for u in https://readyplayerme.github.io/visage/female.glb https://raw.githubusercontent.com/readyplayerme/visage/main/public/female.glb https://raw.githubusercontent.com/readyplayerme/visage/develop/public/female.glb; do [ -s rpm-female.glb ] || get rpm-female.glb $u; done
          get michelle.glb $T/Michelle.glb
          get xbot.glb $T/Xbot.glb
          # more human-style characters from Babylon.js's public asset library (CC BY 4.0): any rigged full-body humanoid it ships
          ( mkdir -p /tmp/bab && cd /tmp/bab && npm init -y >/dev/null && timeout 400 npm install --no-audit --no-fund --ignore-scripts @babylonjs/assets >/dev/null 2>&1 \
            && find node_modules/@babylonjs/assets -iname '*.glb' -size -14M | while read f; do n=$(basename "$f" .glb | tr 'A-Z ' 'a-z_'); cp "$f" "$OLDPWD/bab-$n.glb"; done ) || echo "babylon assets unavailable"
          # keep only full-body humanoids (hips, arms, legs, feet in the skeleton)
          node -e 'const fs=require("fs");const full=f=>{try{const b=fs.readFileSync(f);if(b.readUInt32LE(0)!==0x46546C67)return false;const n=b.readUInt32LE(12),j=JSON.parse(b.slice(20,20+n).toString());const names=(j.nodes||[]).map(x=>String(x.name||"").toLowerCase().replace(/^.*[:|]/,"").replace(/mixamorig\d*/,""));return ["hips","leftupleg","leftleg","leftfoot","leftarm","rightupleg","rightfoot"].every(k=>names.some(x=>x.replace(/[_\s.]/g,"")===k));}catch(e){return false}};const l=fs.readdirSync(".").filter(f=>f.endsWith(".glb")&&fs.statSync(f).size>20000).filter(f=>{const ok=full(f);if(!ok){console.log("not a full-body humanoid, dropped",f);fs.unlinkSync(f);}return ok;}).map(f=>({id:f.replace(/\.glb$/,""),file:f,size:fs.statSync(f).size}));fs.writeFileSync("list.json",JSON.stringify(l));console.log(l)'

      - name: Check every file the app needs is present
        run: |
          for f in $(grep -oE "'(vendor|models)/[^']+'" _site/sw.js | tr -d "'"); do
            test -s "_site/$f" || { echo "MISSING $f"; exit 1; }
          done
          du -sh _site

      - name: Also publish the built site to the gh-pages branch (backup route)
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Built site ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 30
